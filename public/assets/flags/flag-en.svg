<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 14" shape-rendering="crispEdges">
  <!-- UK Union Jack approximation -->
  <rect width="22" height="14" fill="#012169"/>
  <!-- White Diagonals -->
  <path d="M0 0h3l19 14h-3z" fill="#ffffff"/>
  <path d="M19 0h3L3 14H0z" fill="#ffffff"/>
  <!-- Red Diagonals -->
  <path d="M0 0h1l10 7H9z" fill="#c8102e"/> 
  <path d="M12 7h2l8 6h-1z" fill="#c8102e"/>
  <path d="M19 0h1L0 14h-1z" fill="none"/> <!-- skipping complex overlay for simple pixel art feel, focusing on main cross -->
  <path d="M22 0v1L13 7h-2z" fill="#c8102e"/> 
  <path d="M9 7h2L3 14H0z" fill="#c8102e"/>

  <!-- White Cross -->
  <rect x="9" y="0" width="4" height="14" fill="#ffffff"/>
  <rect x="0" y="5" width="22" height="4" fill="#ffffff"/>

  <!-- Red Cross -->
  <rect x="10" y="0" width="2" height="14" fill="#c8102e"/>
  <rect x="0" y="6" width="22" height="2" fill="#c8102e"/>
</svg>
