<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 14" shape-rendering="crispEdges">
  <!-- Clean Pixel Art UK Union Jack -->
  <!-- Blue Background -->
  <rect width="22" height="14" fill="#012169"/>
  
  <!-- White Diagonals - Thicker, cleaner -->
  <polygon points="0,0 4,0 22,12 22,14 18,14 0,2" fill="#ffffff"/>
  <polygon points="22,0 22,2 4,14 0,14 0,12 18,0" fill="#ffffff"/>
  
  <!-- Red Diagonals - Half width of white, offset appropriately -->
  <polygon points="0,0 2,0 11,6 9,7" fill="#c8102e"/>
  <polygon points="11,8 13,7 22,14 20,14" fill="#c8102e"/>
  <polygon points="20,0 22,0 22,1 13,7 11,6" fill="#c8102e"/>
  <polygon points="9,7 11,8 2,14 0,14 0,13" fill="#c8102e"/>
  
  <!-- White Cross - Thick center cross -->
  <rect x="9" y="0" width="4" height="14" fill="#ffffff"/>
  <rect x="0" y="5" width="22" height="4" fill="#ffffff"/>
  
  <!-- Red Cross - St George's Cross in center -->
  <rect x="10" y="0" width="2" height="14" fill="#c8102e"/>
  <rect x="0" y="6" width="22" height="2" fill="#c8102e"/>
</svg>
